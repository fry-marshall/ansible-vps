---
- name: Install UFW
  apt:
    name: ufw
    state: present

- name: Set UFW default policy - deny incoming
  ufw:
    default: deny
    direction: incoming

- name: Set UFW default policy - allow outgoing
  ufw:
    default: allow
    direction: outgoing

- name: Rate-limit SSH port (blocks an IP after 6 attempts / 30s at the kernel level)
  ufw:
    rule: limit
    port: "{{ ssh_port | string }}"
    proto: tcp

- name: Allow other configured ports
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ allowed_ports | reject('equalto', ssh_port | string) | list }}"

- name: Enable UFW
  ufw:
    state: enabled
